apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-inference-deployment
  namespace: ml-project
spec:
  replicas: 1  # Empezamos con 1, luego escalaremos en la Task 5
  selector:
    matchLabels:
      app: ml-inference
  template:
    metadata:
      labels:
        app: ml-inference
    spec:
      containers:
      - name: inference-api
        image: ml-inference:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        volumeMounts:
        - name: storage
          mountPath: /mnt/model
          readOnly: true # Inferencia solo lee el modelo
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: model-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ml-inference-service
  namespace: ml-project
spec:
  type: NodePort
  selector:
    app: ml-inference
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
      nodePort: 30001 # Puerto manual para acceder desde Fedora
